name: mostrans

services:
  ml-service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ML_SERVICE_URL: http://ml-service:8001
      NDTP_HOST: 0.0.0.0
      NDTP_PORT: "9201"
      REGISTRY_PATH: /app/ml/dataset/validate/traffic.csv
      SCHEDULE_PATH: /app/ml/dataset/validate/schedule_plan.csv
      MIN_HORIZON_MINUTES: "10"
      MAX_HORIZON_MINUTES: "15"
      DEFAULT_HORIZON_MINUTES: "12.5"
      PREDICTION_INTERVAL_S: "1"
      STALE_AFTER_S: "30"
      HISTORY_RETENTION_MINUTES: "15"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
      - "9201:9201"
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_PREFIX: /api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped